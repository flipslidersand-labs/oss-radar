name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    uses: flipslidersand-labs/qa-workflows/.github/workflows/python-test.yml@main
    with:
      install-command: pip install -r requirements.txt -r requirements-dev.txt
      ruff-version: "0.17.3"
      coverage-threshold: 90

  audit:
    name: Audit & type check
    runs-on: ${{ vars.GATE_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Audit dependencies (pip-audit)
        run: pip install pip-audit && pip-audit -r requirements.txt -r requirements-dev.txt

      - name: Type check (pyright)
        run: pyright --pythonversion 3.12 collectors/ oss_radar/ ingest.py search.py mcp_server.py models.py
        continue-on-error: true  # 型チェックは警告扱い（#21-#23 完了後に strict 化）
