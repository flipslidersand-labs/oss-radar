name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (pyright)
        run: pyright --pythonversion 3.12 collectors/ oss_radar/ ingest.py search.py mcp_server.py models.py
        continue-on-error: true  # 型チェックは警告扱い（#21-#23 完了後に strict 化）

      - name: Test (pytest)
        run: |
          if [ -d tests ]; then
            pytest tests/ -q --tb=short
          else
            echo "tests/ directory not yet created — skipping (see #21 #22 #23)"
          fi
